<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Sapphire to Midnight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#070D1B"/>
    </linearGradient>

    <!-- Golden Amber Gradient (Primary Accent) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Blue Ambient Glow Gradient -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#1D4ED8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#070D1B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Crisp White/Silver Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Card Base Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- 3D Drop Shadows -->
    <filter id="playShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="goldGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full Bleed App Background (Squircle Google Play style) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border stroke for Play Store icon definition -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Backlight Glows -->
  <circle cx="256" cy="235" r="210" fill="url(#centerGlow)"/>
  <circle cx="256" cy="270" r="140" fill="url(#goldGlow)"/>

  <!-- ICON EMBLEM -->
  <g filter="url(#playShadow)">
    <!-- Storefront Canopy / Awning in Gold & Crisp White -->
    <!-- Back base shadow -->
    <path d="M 120 186 L 392 186 L 416 248 L 96 248 Z" fill="#92400E" opacity="0.85"/>
    
    <!-- Canopy Scallops -->
    <!-- Fold 1: Gold -->
    <path d="M 96 186 L 160 186 L 152 250 Q 124 262 96 250 Z" fill="url(#goldGrad)"/>
    <!-- Fold 2: White -->
    <path d="M 160 186 L 224 186 L 220 250 Q 188 262 152 250 Z" fill="url(#whiteGrad)"/>
    <!-- Fold 3: Gold (Center) -->
    <path d="M 224 186 L 288 186 L 292 250 Q 256 262 220 250 Z" fill="url(#goldGrad)"/>
    <!-- Fold 4: White -->
    <path d="M 288 186 L 352 186 L 360 250 Q 324 262 292 250 Z" fill="url(#whiteGrad)"/>
    <!-- Fold 5: Gold -->
    <path d="M 352 186 L 416 186 L 416 250 Q 388 262 360 250 Z" fill="url(#goldGrad)"/>

    <!-- Awning Top Ridge -->
    <rect x="116" y="182" width="280" height="8" rx="4" fill="#FEF08A" opacity="0.95"/>

    <!-- Main Commerce Card -->
    <rect x="124" y="248" width="264" height="152" rx="24" fill="url(#cardGrad)" stroke="#334155" stroke-width="4"/>

    <!-- Interior POS / Display Glass -->
    <rect x="144" y="268" width="224" height="112" rx="16" fill="#0B1329" stroke="#2563EB" stroke-width="2.5"/>

    <!-- Stylized "C" + Shopping Tag Emblem in Gold -->
    <g filter="url(#goldGlowFilter)">
      <!-- Dynamic stylized "C" -->
      <path d="M 285 292 
               C 240 292 210 310 210 332 
               C 210 354 240 372 285 372 
               C 310 372 328 365 340 356
               L 340 340
               L 310 340
               L 310 349
               C 301 354 292 357 282 357
               C 255 357 236 345 236 332
               C 236 319 255 307 282 307
               C 292 307 301 310 310 315
               L 310 324
               L 340 324
               L 340 308
               C 328 299 310 292 285 292 Z" 
            fill="url(#goldGrad)"/>
      
      <!-- Sparkle / Star in Golden White -->
      <path d="M 334 290 L 338 299 L 347 303 L 338 307 L 334 316 L 330 307 L 321 303 L 330 299 Z" fill="#FFFFFF"/>
    </g>

    <!-- Modern POS Register Base -->
    <rect x="196" y="400" width="120" height="12" rx="6" fill="#475569"/>
    <rect x="160" y="412" width="192" height="10" rx="5" fill="#334155"/>
    <rect x="226" y="415" width="60" height="3" rx="1.5" fill="#F59E0B"/>
  </g>
</svg>